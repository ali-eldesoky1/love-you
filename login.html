<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Love You ❤️</title>

    <link rel="stylesheet" href="login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Intro Screen -->

    <section class="intro" id="intro">

        <div class="intro-content">

            <h1>Love You Huda</h1>

            <span class="heart">♥</span>

        </div>

    </section>


    <!-- Password Screen -->

    <section class="password-screen" id="passwordScreen">

        <div class="password-card">

            <div class="lock-icon">
                <i>♥</i>
            </div>

            <h2>Welcome</h2>

            <p>Enter the secret password</p>

            <form id="passwordForm">

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                        required
                    >

                    <span class="eye" id="togglePassword">◉</span>

                </div>

              <a href="index.html">
                  welcome
              </a>

            </form>

        </div>

    </section>


    <script src="login.js"></script>

</body>

</html>
